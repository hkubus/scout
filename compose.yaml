services:
  scout:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Loopback by default: publish through a TLS-terminating reverse proxy.
      - "${SCOUT_PUBLISH:-127.0.0.1:3001}:3001"
    environment:
      PORT: 3001
      SCOUT_HOST: 0.0.0.0
      SCOUT_DB_PATH: /app/data/scout.sqlite
      SCOUT_SECRET: ${SCOUT_SECRET:?Set SCOUT_SECRET in .env}
      SCOUT_PASSWORD_HASH: ${SCOUT_PASSWORD_HASH:-}
      SCOUT_PASSWORD: ${SCOUT_PASSWORD:-}
      SCOUT_API_TOKENS: ${SCOUT_API_TOKENS:-}
      SCOUT_AUTH: ${SCOUT_AUTH:-}
      SCOUT_TRUST_PROXY: ${SCOUT_TRUST_PROXY:-}
      SCOUT_PUBLIC_ORIGIN: ${SCOUT_PUBLIC_ORIGIN:-}
      SCOUT_DEBUG_API: ${SCOUT_DEBUG_API:-}
      SCOUT_OPENROUTER_API_KEY: ${SCOUT_OPENROUTER_API_KEY:-}
      SCOUT_OPENROUTER_MODEL: ${SCOUT_OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCOUT_BROWSER_WS: ws://chromium:3000
    volumes:
      - scout-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      chromium:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  chromium:
    image: browserless/chrome:1.61-chrome-stable@sha256:efac47cfff3830d9a50b27d29f8bbb61949058ae336c823fbe9bd3c0d1debcc8
    restart: unless-stopped
    init: true
    environment:
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENT_SESSIONS: 2
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/pressure').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  scout-data:

services:
  scout:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      SCOUT_HOST: 0.0.0.0
      SCOUT_DB_PATH: /app/data/scout.sqlite
      SCOUT_SECRET: ${SCOUT_SECRET:?Set SCOUT_SECRET in .env}
      SCOUT_PUBLIC: ${SCOUT_PUBLIC:-false}
      SCOUT_OPENROUTER_API_KEY: ${SCOUT_OPENROUTER_API_KEY:-}
      SCOUT_OPENROUTER_MODEL: ${SCOUT_OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SCOUT_BROWSER_WS: ws://chromium:3000
    volumes:
      - scout-data:/app/data
    depends_on:
      chromium:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  chromium:
    image: browserless/chrome:1.61.0
    restart: unless-stopped
    environment:
      CONNECTION_TIMEOUT: 60000
      MAX_CONCURRENT_SESSIONS: 2
    expose:
      - "3000"

volumes:
  scout-data:

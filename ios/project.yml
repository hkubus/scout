# XcodeGen spec; CI runs `xcodegen generate` to produce Scout.xcodeproj, which
# is not committed. On a Mac: `brew install xcodegen && xcodegen generate`.
name: Scout
options:
  bundleIdPrefix: io.github.hkubus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScoutKit:
    path: ScoutKit
targets:
  Scout:
    type: application
    platform: iOS
    sources:
      - path: Scout
    dependencies:
      - package: ScoutKit
    info:
      path: Scout/Info.plist
      properties:
        CFBundleDisplayName: Scout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: io.github.hkubus.scout
            CFBundleURLSchemes: [scout]
        # The server is user-hosted on a LAN or VPN, often over plain HTTP or
        # with a private CA, so App Transport Security cannot be scoped to a
        # fixed domain.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Scout connects to your Scout server on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hkubus.scout
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
schemes:
  Scout:
    build:
      targets:
        Scout: all
    run:
      config: Debug
    archive:
      config: Release
